<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky-Ocean Circular Badge (pairs with Dory's #94CAFF badge) -->
    <linearGradient id="nemoBadgeBg" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5D4FF" />
      <stop offset="55%" stop-color="#8BC4FF" />
      <stop offset="100%" stop-color="#6BB0FF" />
    </linearGradient>

    <!-- Vibrant Clownfish Orange Body Gradient -->
    <linearGradient id="nemoOrange" x1="20" y1="32" x2="78" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7E1F" />
      <stop offset="55%" stop-color="#FF5E0E" />
      <stop offset="100%" stop-color="#E64800" />
    </linearGradient>

    <!-- Deeper Orange for Fins -->
    <linearGradient id="nemoFinOrange" x1="12" y1="26" x2="65" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7218" />
      <stop offset="100%" stop-color="#E04300" />
    </linearGradient>

    <!-- Clip path for clean stripe alignment inside the fish body -->
    <clipPath id="nemoBodyClip">
      <path d="M21.5 50C21.5 38 35.5 31.8 54 32.3C69.5 32.8 81.5 40.5 83.5 49.2C84.2 52.2 82.8 55.2 79.8 57.5C74.5 64.2 61.5 67.6 47 67.3C33 67 21.5 60.5 21.5 50Z" />
    </clipPath>
  </defs>

  <!-- Circular Sky-Blue Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#nemoBadgeBg)" />
  <circle cx="50" cy="50" r="46.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Subtle Water Bubbles on Right (Echoing Dory's Right-Side Balance) -->
  <circle cx="86.5" cy="34" r="2.6" fill="#FFFFFF" fill-opacity="0.68" />
  <circle cx="89" cy="43" r="1.6" fill="#FFFFFF" fill-opacity="0.52" />
  <circle cx="84" cy="25.5" r="1.4" fill="#FFFFFF" fill-opacity="0.48" />

  <!-- Anterior & Posterior Dorsal Fins (Top) -->
  <path
    d="M32 35.5C35.5 25 46.5 23 53.5 29C56.5 25.2 64.5 25.8 68.5 33.8L65 36.5L32 35.5Z"
    fill="url(#nemoFinOrange)"
    stroke="#0B0F19"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Ventral & Anal Fins (Bottom - clearly visible orange interior) -->
  <path
    d="M33.5 64C36 73.5 45.5 74.5 50 67.5C53.5 73.5 61.5 73.2 65 64.5L33.5 64Z"
    fill="url(#nemoFinOrange)"
    stroke="#0B0F19"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Rounded Clownfish Caudal Fin (Tail on Left) -->
  <path
    d="M24 44.5L13.5 37.2C9.5 35.2 7.8 41.5 8.8 50C7.8 58.5 9.5 64.8 13.5 62.8L24 55.5Z"
    fill="url(#nemoFinOrange)"
    stroke="#0B0F19"
    stroke-width="3.2"
    stroke-linejoin="round"
  />
  <!-- Tail Inner Accent Rays -->
  <path d="M12.8 45.5L20.5 48.5M12.8 54.5L20.5 51.5" stroke="#0B0F19" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />

  <!-- Main Clownfish Body -->
  <path
    d="M21.5 50C21.5 38 35.5 31.8 54 32.3C69.5 32.8 81.5 40.5 83.5 49.2C84.2 52.2 82.8 55.2 79.8 57.5C74.5 64.2 61.5 67.6 47 67.3C33 67 21.5 60.5 21.5 50Z"
    fill="url(#nemoOrange)"
  />

  <!-- Clipped Iconic White Clownfish Stripes with Bold Black Borders -->
  <g clip-path="url(#nemoBodyClip)">
    <!-- Subtle Top Highlight -->
    <path
      d="M25 42C36 33.8 62 33.2 78 42"
      stroke="#FFA366"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.48"
    />

    <!-- Stripe 1: Tail Peduncle Stripe (Left - leaves visible orange peduncle before tail) -->
    <path
      d="M30 29C28.2 42 28.2 58 30 71"
      stroke="#0B0F19"
      stroke-width="9"
      stroke-linecap="round"
    />
    <path
      d="M30 29C28.2 42 28.2 58 30 71"
      stroke="#FFFFFF"
      stroke-width="4.2"
      stroke-linecap="round"
    />

    <!-- Stripe 2: Signature Middle Saddle Stripe (Center with Forward Bulge) -->
    <path
      d="M48 28C48.5 38 43.5 44.5 43.5 50C43.5 55.5 48.5 62 48 72"
      stroke="#0B0F19"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M48 28C48.5 38 43.5 44.5 43.5 50C43.5 55.5 48.5 62 48 72"
      stroke="#FFFFFF"
      stroke-width="6.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Stripe 3: Head Collar Stripe (Behind Eye) -->
    <path
      d="M66.8 29C63.5 41.5 64 58.5 67.8 71"
      stroke="#0B0F19"
      stroke-width="11"
      stroke-linecap="round"
    />
    <path
      d="M66.8 29C63.5 41.5 64 58.5 67.8 71"
      stroke="#FFFFFF"
      stroke-width="5.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Body Outer Contour for Crisp Contrast at Small Favicon Sizes -->
  <path
    d="M21.5 50C21.5 38 35.5 31.8 54 32.3C69.5 32.8 81.5 40.5 83.5 49.2C84.2 52.2 82.8 55.2 79.8 57.5C74.5 64.2 61.5 67.6 47 67.3C33 67 21.5 60.5 21.5 50Z"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Nemo's Lucky Pectoral Fin (Center-Right, Rounded with Black Rim) -->
  <path
    d="M55.5 51.5C61 50 64 54.5 61 58.5C58.5 61.5 53 60 52 56.5C51.5 54 53 52.2 55.5 51.5Z"
    fill="#FF7A1A"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Expressive Eye -->
  <circle cx="74.8" cy="45.5" r="4.3" fill="#0B0F19" />
  <circle cx="76" cy="44.2" r="1.5" fill="#FFFFFF" />

  <!-- Subtle Friendly Smile -->
  <path
    d="M82.5 53.2C80.2 54.5 77.5 54.2 75.8 52.8"
    stroke="#0B0F19"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
