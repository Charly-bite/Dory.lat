<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky-Ocean Circular Badge (identical to Nemo & Crush family) -->
    <linearGradient id="doryBadgeBg" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5D4FF" />
      <stop offset="55%" stop-color="#8BC4FF" />
      <stop offset="100%" stop-color="#6BB0FF" />
    </linearGradient>

    <!-- Vibrant Regal Blue Tang Body Gradient -->
    <linearGradient id="doryBlue" x1="22" y1="32" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Clearly Visible Royal Blue for Dorsal & Ventral Fins -->
    <linearGradient id="doryFinBlue" x1="25" y1="24" x2="65" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Vibrant Lemon-Gold for Tail & Pectoral Tip -->
    <linearGradient id="doryYellow" x1="8" y1="38" x2="26" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Clip path for clean markings inside the fish body -->
    <clipPath id="doryBodyClip">
      <path d="M22 52C22 38.5 36 31.5 54.5 32C70 32.5 81.8 41.2 83.8 51C84.4 54 83 57.2 80 59.8C74.5 67.2 61.2 71.5 46.8 71C32.8 70.5 22 63.5 22 52Z" />
    </clipPath>
  </defs>

  <!-- Circular Sky-Blue Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#doryBadgeBg)" />
  <circle cx="50" cy="50" r="46.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Subtle Water Bubbles on Right -->
  <circle cx="87.5" cy="36" r="2.4" fill="#FFFFFF" fill-opacity="0.68" />
  <circle cx="89.5" cy="45" r="1.5" fill="#FFFFFF" fill-opacity="0.52" />

  <!-- Sweeping Surgeonfish Dorsal Fin -->
  <path
    d="M30 35.5C34.5 25.5 48.5 24 63.5 29.5L62 36.5L30 35.5Z"
    fill="url(#doryFinBlue)"
    stroke="#0B0F19"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Sweeping Ventral Fin -->
  <path
    d="M32 67.5C36.5 76.5 50 77.5 63.5 70.5L61 66.5L32 67.5Z"
    fill="url(#doryFinBlue)"
    stroke="#0B0F19"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Iconic Yellow Caudal Fin (Tail on Left) -->
  <path
    d="M24 46.5L12.5 38.5C9 36.8 7.6 43.2 8.6 52C7.6 60.8 9 67.2 12.5 65.5L24 57.5Z"
    fill="url(#doryYellow)"
    stroke="#0B0F19"
    stroke-width="3.2"
    stroke-linejoin="round"
  />
  <path d="M12.8 47.5L20.5 50.5M12.8 56.5L20.5 53.5" stroke="#0B0F19" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />

  <!-- Main Regal Blue Tang Body -->
  <path
    d="M22 52C22 38.5 36 31.5 54.5 32C70 32.5 81.8 41.2 83.8 51C84.4 54 83 57.2 80 59.8C74.5 67.2 61.2 71.5 46.8 71C32.8 70.5 22 63.5 22 52Z"
    fill="url(#doryBlue)"
  />

  <!-- Clipped Iconic Palette-Tang Marking -->
  <g clip-path="url(#doryBodyClip)">
    <path
      d="M28 40C40 33.5 62 33.5 77 41.5"
      stroke="#93C5FD"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.55"
    />
    <path
      d="M21 52C26 41 40 37 56 37.5C65.5 37.8 71.5 41.5 74.5 46.5C69 46.5 65.5 50 63 54C58.5 59.5 48.5 61.5 38.5 59.5C31 58 25.5 55.5 21 52Z"
      fill="#0B0F19"
    />
    <ellipse
      cx="47.5"
      cy="49.5"
      rx="11.5"
      ry="5.2"
      transform="rotate(-6 47.5 49.5)"
      fill="url(#doryBlue)"
    />
  </g>

  <!-- Body Outer Contour -->
  <path
    d="M22 52C22 38.5 36 31.5 54.5 32C70 32.5 81.8 41.2 83.8 51C84.4 54 83 57.2 80 59.8C74.5 67.2 61.2 71.5 46.8 71C32.8 70.5 22 63.5 22 52Z"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Dory's Pectoral Fin -->
  <path
    d="M55.5 54C61 52.5 64 57 61 61C58.5 64 53 62.5 52 59C51.5 56.5 53 54.7 55.5 54Z"
    fill="url(#doryYellow)"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Expressive Eye -->
  <circle cx="74.8" cy="47.2" r="4.6" fill="#0B0F19" />
  <circle cx="74.8" cy="47.2" r="3.4" fill="#BE185D" />
  <circle cx="74.8" cy="47.2" r="2.2" fill="#0B0F19" />
  <circle cx="76" cy="45.9" r="1.4" fill="#FFFFFF" />

  <!-- Subtle Friendly Smile -->
  <path
    d="M82.5 55.2C80.2 56.6 77.2 56.3 75.5 54.8"
    stroke="#0B0F19"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Academic Mortarboard (Birrete Universitario UDG) on Dory's Head -->
  <path
    d="M56 28.5L73.5 26.5L74.5 33.2C68.5 35.2 61.5 35.5 55.5 33.8Z"
    fill="#1E293B"
    stroke="#0B0F19"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <polygon
    points="47,25.5 65.5,18 83.5,22.5 65,30"
    fill="#0F172A"
    stroke="#0B0F19"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <circle cx="65.2" cy="24" r="2" fill="#FFE600" />
  <path
    d="M65.2 24C71 25.2 76 28 77.5 34"
    stroke="#FFE600"
    stroke-width="2.3"
    stroke-linecap="round"
  />
  <circle cx="77.5" cy="34.5" r="2" fill="#FFE600" />
</svg>
