<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky-Ocean Circular Badge (Dory EDU family) -->
    <linearGradient id="otterBadgeBg" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5D4FF" />
      <stop offset="55%" stop-color="#8BC4FF" />
      <stop offset="100%" stop-color="#6BB0FF" />
    </linearGradient>

    <!-- Sea Otter Warm Chestnut Fur Gradient -->
    <linearGradient id="otterFur" x1="25" y1="20" x2="75" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="55%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="otterCoat" x1="25" y1="20" x2="75" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2641A" />
      <stop offset="55%" stop-color="#9A4409" />
      <stop offset="100%" stop-color="#6B2D04" />
    </linearGradient>

    <!-- Creamy Golden Muzzle & Belly -->
    <linearGradient id="otterCream" x1="35" y1="35" x2="65" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Retro-Modern Gamepad Gradient -->
    <linearGradient id="gamepadBg" x1="30" y1="54" x2="72" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Circular Sky-Blue Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#otterBadgeBg)" />
  <circle cx="50" cy="50" r="46.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Subtle Water Bubbles on Right -->
  <circle cx="87.5" cy="33" r="2.4" fill="#FFFFFF" fill-opacity="0.68" />
  <circle cx="89.5" cy="42" r="1.5" fill="#FFFFFF" fill-opacity="0.52" />
  <circle cx="84.5" cy="25" r="1.3" fill="#FFFFFF" fill-opacity="0.48" />

  <!-- Otter Rounded Ears -->
  <circle cx="29" cy="31" r="6.5" fill="url(#otterCoat)" stroke="#0B0F19" stroke-width="2.8" />
  <circle cx="29.5" cy="31.5" r="3" fill="#FDE68A" />
  <circle cx="71" cy="31" r="6.5" fill="url(#otterCoat)" stroke="#0B0F19" stroke-width="2.8" />
  <circle cx="70.5" cy="31.5" r="3" fill="#FDE68A" />

  <!-- Otter Body & Head Silhouette -->
  <path
    d="M25 68C23 55 26 45 27 38C28 26.5 37.5 21 50 21C62.5 21 72 26.5 73 38C74 45 77 55 75 68C73 79 63 83 50 83C37 83 27 79 25 68Z"
    fill="url(#otterCoat)"
    stroke="#0B0F19"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Forehead Highlight -->
  <path
    d="M39 26C45 23.8 55 23.8 61 26"
    stroke="#E08B43"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.65"
  />

  <!-- Creamy Face Cheeks / Whisker Pads -->
  <path
    d="M32 43C32 37.5 39 35 50 35C61 35 68 37.5 68 43C68 49.5 62 53.5 50 53.5C38 53.5 32 49.5 32 43Z"
    fill="url(#otterCream)"
    stroke="#0B0F19"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <!-- Expressive Bright Eyes -->
  <circle cx="40.5" cy="36.5" r="3.8" fill="#0B0F19" />
  <circle cx="41.6" cy="35.3" r="1.4" fill="#FFFFFF" />
  <circle cx="59.5" cy="36.5" r="3.8" fill="#0B0F19" />
  <circle cx="60.6" cy="35.3" r="1.4" fill="#FFFFFF" />

  <!-- Cute Diamond Sea-Otter Nose & Smile -->
  <path
    d="M46.5 42.5C46.5 40.8 53.5 40.8 53.5 42.5C53.5 44.5 51.5 46.2 50 46.2C48.5 46.2 46.5 44.5 46.5 42.5Z"
    fill="#0B0F19"
  />
  <path
    d="M50 46.2V48.5M50 48.5C47.5 50.5 44.5 50 43.2 48.2M50 48.5C52.5 50.5 55.5 50 56.8 48.2"
    stroke="#0B0F19"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Whiskers -->
  <path
    d="M28 43.5L35 44.5M28.5 47.5L35.5 47M72 43.5L65 44.5M71.5 47.5L64.5 47"
    stroke="#0B0F19"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Gamepad Controller Held by the Otter -->
  <path
    d="M32 58.5C32 55 35.5 53 40 53.5L44.5 54H55.5L60 53.5C64.5 53 68 55 68 58.5L69.5 69.5C70 73.5 66 76 62.5 74L57.5 69.5H42.5L37.5 74C34 76 30 73.5 30.5 69.5L32 58.5Z"
    fill="url(#gamepadBg)"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Gamepad D-Pad (Left, Yellow Gold) -->
  <path
    d="M39.5 59.5V65.5M36.5 62.5H42.5"
    stroke="#FFE600"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Gamepad Action Buttons (Right, Emerald & Coral) -->
  <circle cx="61" cy="60.5" r="2.1" fill="#38BDF8" />
  <circle cx="57.5" cy="64" r="2.1" fill="#4ADE80" />
  <circle cx="62.5" cy="65" r="2.1" fill="#FF6E40" />

  <!-- Otter Paws Holding the Gamepad Sides -->
  <ellipse cx="29.5" cy="64" rx="5" ry="4" transform="rotate(-15 29.5 64)" fill="url(#otterCoat)" stroke="#0B0F19" stroke-width="2.6" />
  <ellipse cx="70.5" cy="64" rx="5" ry="4" transform="rotate(15 70.5 64)" fill="url(#otterCoat)" stroke="#0B0F19" stroke-width="2.6" />
</svg>
