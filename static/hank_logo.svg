<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky-Ocean Circular Badge (Dory EDU family) -->
    <linearGradient id="hankBadgeBg" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5D4FF" />
      <stop offset="55%" stop-color="#8BC4FF" />
      <stop offset="100%" stop-color="#6BB0FF" />
    </linearGradient>

    <!-- Hank Octopus Crimson-Coral Gradient -->
    <linearGradient id="hankBody" x1="25" y1="18" x2="75" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6E40" />
      <stop offset="55%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <!-- Deeper Coral for Back Tentacles -->
    <linearGradient id="hankDark" x1="20" y1="50" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E64A19" />
      <stop offset="100%" stop-color="#9A2607" />
    </linearGradient>

    <!-- Cyber SOC Visor / HUD Cyan Gradient -->
    <linearGradient id="socVisor" x1="48" y1="38" x2="82" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Circular Sky-Blue Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#hankBadgeBg)" />
  <circle cx="50" cy="50" r="46.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Subtle Water Bubbles on Right -->
  <circle cx="87.5" cy="33" r="2.4" fill="#FFFFFF" fill-opacity="0.68" />
  <circle cx="89.5" cy="42" r="1.5" fill="#FFFFFF" fill-opacity="0.52" />
  <circle cx="84.5" cy="25" r="1.3" fill="#FFFFFF" fill-opacity="0.48" />

  <!-- Back Tentacles (Left & Right Depth) -->
  <path
    d="M32 56C20 58 11 52 13 43C14.5 37 21 38 22 43C23 47 19 49 26 50"
    fill="url(#hankDark)"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M68 56C79 56 88 50 86 41C84.5 35.5 78.5 37 78 41.5C77.5 45.5 81 47.5 74 49"
    fill="url(#hankDark)"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Main Octopus Mantle (Head Dome) & Front Curling Tentacles -->
  <path
    d="M31 46C29 30 38 19.5 52 19.5C66 19.5 74 30 71 46C76 53 84 62 80 71.5C77 78 68 78 65 71.5C63 67 66 63 61 61C59 68 58 77.5 51 79.5C44 81.5 39 75.5 41 68.5C42 65 45 64 43 60.5C37 64 31 74.5 23 72.5C15 70.5 15 59.5 22 54C26 51 29.5 49 31 46Z"
    fill="url(#hankBody)"
    stroke="#0B0F19"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Head Dome Highlight -->
  <path
    d="M38 28.5C43 23.5 53 22.5 60 26"
    stroke="#FFAB91"
    stroke-width="2.8"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- Golden Suction Cups on Curling Tentacles -->
  <circle cx="21.5" cy="67.5" r="2.3" fill="#FDE68A" stroke="#0B0F19" stroke-width="1.8" />
  <circle cx="28" cy="69.5" r="2.3" fill="#FDE68A" stroke="#0B0F19" stroke-width="1.8" />
  <circle cx="45.5" cy="75.5" r="2.3" fill="#FDE68A" stroke="#0B0F19" stroke-width="1.8" />
  <circle cx="52.5" cy="76.5" r="2.3" fill="#FDE68A" stroke="#0B0F19" stroke-width="1.8" />
  <circle cx="71.5" cy="73.5" r="2.3" fill="#FDE68A" stroke="#0B0F19" stroke-width="1.8" />
  <circle cx="77" cy="69" r="2.3" fill="#FDE68A" stroke="#0B0F19" stroke-width="1.8" />

  <!-- Strap around head (drawn behind eyes) -->
  <path d="M30.5 42L41 42M50.5 42.5L53.5 42.5M69.5 42L72 41.5" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />

  <!-- Left Expressive Eye (Uncovered) -->
  <circle cx="45.5" cy="43.5" r="5.2" fill="#FFFFFF" stroke="#0B0F19" stroke-width="2.6" />
  <circle cx="46.8" cy="43.8" r="2.7" fill="#0B0F19" />
  <circle cx="47.6" cy="42.8" r="1" fill="#FFFFFF" />

  <!-- Right Eye: Cyber SOC Threat-Hunting HUD Monocle / Visor -->
  <!-- Glowing Cyan Cyber Lens -->
  <rect
    x="53"
    y="36.5"
    width="17.5"
    height="13"
    rx="6.5"
    fill="url(#socVisor)"
    stroke="#0B0F19"
    stroke-width="2.8"
  />
  <!-- HUD Crosshair / SPL Prompt '>' inside Visor -->
  <path
    d="M58.5 40.5L62 43L58.5 45.5M63.5 45.5H66.5"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Hank's Determined Brow Ridge -->
  <path
    d="M39.5 37.5C43 36.5 47.5 38 50.5 39.5"
    stroke="#0B0F19"
    stroke-width="2.8"
    stroke-linecap="round"
  />

  <!-- Confident Slight Smirk -->
  <path
    d="M49 53.5C52.5 55 56.5 54.5 59 52.5"
    stroke="#0B0F19"
    stroke-width="2.3"
    stroke-linecap="round"
  />
</svg>
